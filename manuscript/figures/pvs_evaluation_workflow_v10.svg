   </g>
   <g id="text_7">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #171717" x="39.860787" y="102.458597" transform="rotate(-0 39.860787 102.458597)">V1/D1</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #171717" x="39.860787" y="124.568834" transform="rotate(-0 39.860787 124.568834)">V2/D2</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #171717" x="39.860787" y="146.67907" transform="rotate(-0 39.860787 146.67907)">V3/D3</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #505653" x="17.659843" y="177.064577" transform="rotate(-0 17.659843 177.064577)">S: scenario; V/D: vehicle/driver pair</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #171717" x="17.659843" y="190.187884" transform="rotate(-0 17.659843 190.187884)">Hold out one row OR one column.</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #171717" x="17.659843" y="202.569616" transform="rotate(-0 17.659843 202.569616)">Repeat over 3 domains per axis.</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #171717" transform="translate(207.906224 73.698992)">Development acquisitions</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #171717" transform="translate(203.998216 85.173992)">Random / trip / matched CV</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #171717" transform="translate(207.272044 141.208914)">Outer-domain acquisitions</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #171717" transform="translate(199.808646 153.507351)">Excluded from inner selection</text>
   </g>
   <g id="text_15">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1f6f5f" transform="translate(361.46747 74.52243)">Select one of four candidates</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1f6f5f" transform="translate(368.159892 85.99743)">Save its inner F1 estimate</text>
   </g>
   <g id="text_16">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #171717" transform="translate(367.15915 141.208914)">Refit on development data</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #171717" transform="translate(370.931689 153.507351)">Predict the outer domain</text>
   </g>
   <g id="text_17">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1f6f5f" transform="translate(223.348997 222.733146)">Selection endpoint</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1f6f5f" transform="translate(229.617747 234.956544)">Outer macro-F1</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1f6f5f" transform="translate(229.897318 245.683146)">Higher is better</text>
   </g>
   <g id="text_18">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1f6f5f" transform="translate(381.008838 222.733146)">Estimation endpoint</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1f6f5f" transform="translate(379.45958 234.108537)">|inner F1 − outer F1|</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1f6f5f" transform="translate(392.0004 246.506583)">Lower is better</text>
   </g>
   <g id="text_19">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #171717" x="17.659843" y="279.218435" transform="rotate(-0 17.659843 279.218435)">Mean absolute estimation error is averaged over the three outer domains of an axis.</text>
   </g>
   <g id="text_20">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #505653" x="17.659843" y="291.448199" transform="rotate(-0 17.659843 291.448199)">Both axes reuse the same nine acquisitions; windows, candidates and fits do not add independent samples.</text>
   </g>
  </g>
