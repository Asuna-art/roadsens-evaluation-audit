    <text style="font-weight: 700; font-size: 10.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #171717" x="17.659843" y="18.448438" transform="rotate(-0 17.659843 18.448438)">Evaluate the selected system and its estimate separately</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #505653" x="17.659843" y="34.388987" transform="rotate(-0 17.659843 34.388987)">PVS: binary speed-bump task; fixed candidates; nested evaluation within nine acquisitions</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #171717" x="17.659843" y="59.903161" transform="rotate(-0 17.659843 59.903161)">Acquisition structure</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #171717" x="67.023307" y="84.05811" transform="rotate(-0 67.023307 84.05811)">S1</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #171717" x="100.156535" y="84.05811" transform="rotate(-0 100.156535 84.05811)">S2</text>
   </g>
   <g id="text_6">
